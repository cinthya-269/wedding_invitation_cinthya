<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wedding letter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="navbar">
        <div class="logo">
            <h2 style="color: #FFAAB8; padding: 8px;">Wedding Invitation</h2>
        </div>

        <div class="menu" id="menu">
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#location">Location</a></li>
                <li><a href="#schedule">Schedule</a></li>
                <li><a href="#gallery">Gallery</a></li>
                <li><a href="#rsvp">RSVP</a></li>
            </ul>
        </div>
    </section>

    <!-- Home Section -->
    <section class="home" id="home">
        <div class="wedding-home">
            <h1 style="color: #59AC77; padding-top: 300px;">Shinazugawa Sanemi</h1>
            <img src="images/Kanae x Sanemi.jpg" alt="sanekana" class="sanekana" style="margin: 100px;">
            <h1 style="color: #B03052; padding-top: 300px;">Kocho Kanae</h1>
        </div>
    </section>

    <!-- Location Section -->
    <section class="location" id="location">
        <h1>Location</h1>
        <div class="location-container">
            <iframe src="https://maps.app.goo.gl/XV5NVrvskEXfjRvJA"
             width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
             <a href="https://maps.app.goo.gl/XV5NVrvskEXfjRvJA" target="_blank">View on Google Maps</a>
            </div>
        </div>
    </section>

    <!-- Schedule Section -->
    <section class="schedule" id="schedule">
        <h1>Schedule</h1>
        <div class="schedule-container">
            <div class="schedule-item">
                <h2>Wedding Ceremony</h2>
                <p>Date: 14-12-2026</p>
                <p>Time: 05:00 PM</p>
                <p>Location: Hotel Chinzanso Tokyo</p>
            </div>
        </div>
    </section>

    <!-- Gallery Section -->
    <section class="gallery" id="gallery">
        <h1>Gallery</h1>
        <div class="gallery-container">
            <img src="images/sanemi.jpg" alt="Gallery Image 1">
            <img src="images/Sanemi x Kanae.jpg" alt="Gallery Image 2">
            <img src="images/sanemi x kanae.jpg" alt="Gallery Image 3">
            <img src="images/kanae.jpg" alt="Gallery Image 4">
        </div>
    </section>

    <!-- RSVP Section -->
    <section class="rsvp" id="rsvp">
        <h1>RSVP</h1>
        <form action="submit_rsvp.php" method="POST">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="attending">Will you attend?</label>
            <select id="attending" name="attending" required>
                <option value="">Select an option</option>
                <option value="yes">Yes</option>
                <option value="no">No</option>
            </select>

            <label for="letter">leave a message for us :</label>
            <input type="text" id="letter" name="letter" required>


            <button type="submit">Submit RSVP</button>
        </form>
    </section>
</body>
</html>
